<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-label="Dimensioned bay module: 24 by 64 mm board, 12 underside pads near the outer edge, a round dowel hole and a slot, an ID chip zone, and a tool exit zone at the bottom end">
<style>
svg{display:block;width:100%;height:auto;min-width:620px;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-size:11px}
.t{fill:#0B0E18;font-weight:650;font-size:11.5px}
.tm{fill:#555D6B;font-size:10.5px}
.h{fill:#0B0E18;font-weight:700;font-size:12.5px}
.dim{stroke:#555D6B;stroke-width:1;fill:none}
.dimt{fill:#555D6B;font-size:10px;font-weight:600}
.board{fill:#161A22;stroke:#3A4258;stroke-width:1.5}
.padb{fill:none;stroke:#C9A227;stroke-width:1.4;stroke-dasharray:2.2 1.6}
.hole{fill:#F3F0E9;stroke:#C9A227;stroke-width:1.6}
.zone{fill:#FDA734;fill-opacity:.22;stroke:#FDA734;stroke-width:1.2;stroke-dasharray:4 3}
.silk{fill:none;stroke:#E6ECF5;stroke-width:.9;stroke-dasharray:3 2.5;opacity:.8}
.silktext{fill:#E6ECF5;font-size:9.5px;opacity:.9}
.wall{fill:#DDD6C7;stroke:#555D6B;stroke-width:.8}
.shell{fill:#DDD6C7;fill-opacity:.35;stroke:#555D6B;stroke-width:.8}
.pcbs{fill:#161A22;stroke:#3A4258;stroke-width:.8}
.batt{fill:#B8BEC8;fill-opacity:.35;stroke:#8C95A6;stroke-width:.8}
.part{fill:#5A6273;stroke:#8C95A6;stroke-width:.6}
.disp{fill:#0B0E18;stroke:#5A6273;stroke-width:.6}
.gold{fill:#C9A227}
.goldl{stroke:#C9A227;stroke-width:2;stroke-linecap:round}
.guide{stroke:#FDA734;stroke-width:1;stroke-dasharray:4 3}
.lead{stroke:#555D6B;stroke-width:.9;fill:none}
.num{fill:#0B0E18;font-size:10px;font-weight:700}
.numw{fill:#FFFFFF;font-size:10px;font-weight:700}
.springbody{fill:#5A6273;stroke:#8C95A6;stroke-width:.6}
.ghost{fill:none;stroke:#555D6B;stroke-dasharray:4 3}
.arrowl{stroke:#0B0E18;stroke-width:1.3;fill:none}
svg{display:block;min-width:0;width:auto}
</style>
<rect x="0" y="0" width="700" height="420" fill="#F3F0E9"/>
    <text x="80" y="22" class="tm">↑ toward the radio head (north)</text>
    <line x1="80" y1="40" x2="200" y2="40" class="dim"/><line x1="80" y1="35" x2="80" y2="45" class="dim"/><line x1="200" y1="35" x2="200" y2="45" class="dim"/>
    <text x="140" y="36" text-anchor="middle" class="dimt">24.0</text>
    <line x1="64" y1="60" x2="64" y2="380" class="dim"/><line x1="59" y1="60" x2="69" y2="60" class="dim"/><line x1="59" y1="380" x2="69" y2="380" class="dim"/>
    <text x="58" y="224" text-anchor="middle" class="dimt" transform="rotate(-90 58 224)">64.0</text>
    <rect x="80" y="60" width="120" height="320" rx="5" class="board"/>
    <rect x="95" y="350" width="90" height="45" class="zone"/>
    <rect x="110" y="170" width="35" height="40" class="silk"/><text x="127.5" y="193" text-anchor="middle" class="silktext">ID chip</text>
    <text x="140" y="290" text-anchor="middle" class="silktext">parts ≤ 2.5 mm</text><text x="140" y="302" text-anchor="middle" class="silktext">(estimate)</text>
    <g class="padb">
      <circle cx="191" cy="188.25" r="4"/><circle cx="191" cy="200.95" r="4"/><circle cx="191" cy="213.65" r="4"/><circle cx="191" cy="226.35" r="4"/><circle cx="191" cy="239.05" r="4"/><circle cx="191" cy="251.75" r="4"/>
      <circle cx="178.3" cy="188.25" r="4"/><circle cx="178.3" cy="200.95" r="4"/><circle cx="178.3" cy="213.65" r="4"/><circle cx="178.3" cy="226.35" r="4"/><circle cx="178.3" cy="239.05" r="4"/><circle cx="178.3" cy="251.75" r="4"/>
    </g>
    <g class="dimt"><text x="204" y="191.5">6</text><text x="204" y="204.2">5</text><text x="204" y="216.9">4</text><text x="204" y="229.6">3</text><text x="204" y="242.3">2</text><text x="204" y="255">1</text></g>
    <g class="silktext" text-anchor="end"><text x="171" y="191.5">12</text><text x="171" y="204.2">11</text><text x="171" y="216.9">10</text><text x="171" y="229.6">9</text><text x="171" y="242.3">8</text><text x="171" y="255">7</text></g>
    <circle cx="100" cy="100" r="3.9" class="hole"/><text x="108" y="96" class="silktext">Ø1.55 round</text>
    <rect x="136.1" y="252.5" width="7.75" height="15" rx="3.9" class="hole"/><text x="148" y="263" class="silktext">1.55 × 3.0 slot</text>
    <line x1="80" y1="172" x2="191" y2="172" class="dim" stroke-dasharray="3 2"/><text x="150" y="168" class="dimt" fill="#E6ECF5">22.20</text>
    <line x1="216" y1="60" x2="216" y2="188.25" class="dim"/><line x1="211" y1="188.25" x2="221" y2="188.25" class="dim"/><text x="220" y="128" class="dimt">25.65</text>
    <text x="80" y="412" class="tm">↓ bottom wall: tool exit zone (amber), Bay B only</text>

    <text x="250" y="70" class="t">Board</text><text x="320" y="70" class="tm">24.0 × 64.0 mm, 1.6 mm FR-4, 1 mm corner radius, ±0.15 mm</text>
    <text x="250" y="96" class="t">Pads</text><text x="320" y="96" class="tm">12 × Ø1.6 mm ENIG on the underside, 2 × 6 at 2.54 mm pitch.</text>
    <text x="320" y="109" class="tm">Outer column at x 22.20, inner at 19.66; first row at y 25.65</text>
    <text x="250" y="135" class="t">Underside</text><text x="320" y="135" class="tm">Pads only: no parts, and no vias or bare copper within 1 mm of a pad</text>
    <text x="250" y="161" class="t">Top side</text><text x="320" y="161" class="tm">Parts up to about 2.5 mm tall, kept 0.5 mm from the edge</text>
    <text x="250" y="187" class="t">Dowels</text><text x="320" y="187" class="tm">Ø1.55 round hole at (4.0, 8.0) and 1.55 × 3.0 slot at (12.0, 40.0).</text>
    <text x="320" y="200" class="tm">Offset, so a module turned 180° can't seat (it would put VBAT on CIPO)</text>
    <text x="250" y="226" class="t">ID chip</text><text x="320" y="226" class="tm">M24C02 (256 B) or M24C16 (2 KB) at 0x50, near pads 5–6 (SDA, SCL)</text>
    <text x="250" y="252" class="t">Inrush</text><text x="320" y="252" class="tm">≤ 10 µF on 3V3_SW, ≤ 47 µF on VBAT_SW; more needs its own soft-start</text>
    <text x="250" y="278" class="t">Power</text><text x="320" y="278" class="tm">≤ 100 mA from 3V3_SW (ID chip and logic); real loads run from VBAT_SW</text>
    <text x="320" y="291" class="tm">(≤ 300 mA) through the module's own regulator</text>
    <text x="250" y="317" class="t">Tool exit</text><text x="320" y="317" class="tm">Bay B only: connector ≤ 3.0 mm tall in x 3–21, may overhang 3 mm</text>
    <text x="320" y="330" class="tm">through the 18 × 3.2 mm slot in the carrier's bottom wall</text>
    <text x="250" y="356" class="t">Silkscreen</text><text x="320" y="356" class="tm">Name, revision, north arrow, and a LAB mark if it applies</text>
    <text x="250" y="382" class="t">No radios</text><text x="320" y="382" class="tm">Bays never carry a transmitter; radios go in the radio head</text>
  </svg>
