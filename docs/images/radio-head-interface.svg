    <polygon points="470,94 458,91.2 458,108.8 470,106" fill="#F3F0E9" stroke="#555D6B"/>
    <text x="70" y="93" class="tm">row B</text><text x="70" y="114" class="tm">row A</text>
    <circle cx="138.24" cy="110.16" r="7" fill="#98A0AC"/>
    <text x="138.24" y="113.3" text-anchor="middle" class="num" font-size="8.5">1</text>
    <text x="135.24" y="126" class="pin" transform="rotate(50 135.24 126)">GND</text>
    <circle cx="158.56" cy="110.16" r="7" fill="#FDA734"/>
    <text x="158.56" y="113.3" text-anchor="middle" class="num" font-size="8.5">2</text>
    <text x="155.56" y="126" class="pin" transform="rotate(50 155.56 126)">VBAT</text>
    <circle cx="178.88" cy="110.16" r="7" fill="#FDA734"/>
