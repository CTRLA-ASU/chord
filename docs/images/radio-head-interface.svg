<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-label="Top end face of the badge with 24 numbered spring contacts in two rows, asymmetric dovetail grooves, and a three-step push-on sequence">
<style>
svg{display:block;width:100%;height:auto;min-width:620px;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-size:11px}
.t{fill:#0B0E18;font-weight:650;font-size:11.5px}
.tm{fill:#555D6B;font-size:10.5px}
.h{fill:#0B0E18;font-weight:700;font-size:12.5px}
.dim{stroke:#555D6B;stroke-width:1;fill:none}
.dimt{fill:#555D6B;font-size:10px;font-weight:600}
.board{fill:#161A22;stroke:#3A4258;stroke-width:1.5}
.padb{fill:none;stroke:#C9A227;stroke-width:1.4;stroke-dasharray:2.2 1.6}
.hole{fill:#F3F0E9;stroke:#C9A227;stroke-width:1.6}
.zone{fill:#FDA734;fill-opacity:.22;stroke:#FDA734;stroke-width:1.2;stroke-dasharray:4 3}
.silk{fill:none;stroke:#E6ECF5;stroke-width:.9;stroke-dasharray:3 2.5;opacity:.8}
.silktext{fill:#E6ECF5;font-size:9.5px;opacity:.9}
.wall{fill:#DDD6C7;stroke:#555D6B;stroke-width:.8}
.shell{fill:#DDD6C7;fill-opacity:.35;stroke:#555D6B;stroke-width:.8}
.pcbs{fill:#161A22;stroke:#3A4258;stroke-width:.8}
.batt{fill:#B8BEC8;fill-opacity:.35;stroke:#8C95A6;stroke-width:.8}
.part{fill:#5A6273;stroke:#8C95A6;stroke-width:.6}
.disp{fill:#0B0E18;stroke:#5A6273;stroke-width:.6}
.gold{fill:#C9A227}
.goldl{stroke:#C9A227;stroke-width:2;stroke-linecap:round}
.guide{stroke:#FDA734;stroke-width:1;stroke-dasharray:4 3}
.lead{stroke:#555D6B;stroke-width:.9;fill:none}
.num{fill:#0B0E18;font-size:10px;font-weight:700}
.numw{fill:#FFFFFF;font-size:10px;font-weight:700}
.springbody{fill:#5A6273;stroke:#8C95A6;stroke-width:.6}
.ghost{fill:none;stroke:#555D6B;stroke-dasharray:4 3}
.arrowl{stroke:#0B0E18;stroke-width:1.3;fill:none}
.pocket{fill:#F3F0E9;stroke:#555D6B;stroke-width:.9}
.modg{fill:#161A22;fill-opacity:.55}
.steel{fill:#C9CED6;stroke:#5A6273;stroke-width:.8}
.screw{fill:none;stroke:#0B0E18;stroke-width:1.4}
.mk{fill:#0B0E18}
.mkt{fill:#F3F0E9;font-size:9px;font-weight:700}
.khl{stroke:#00C8E6;stroke-width:1.1}
.keep{fill:url(#kh2);stroke:#00C8E6;stroke-width:1}
.rsv{fill:none;stroke:#555D6B;stroke-width:1.2;stroke-dasharray:2 1.5}
.headb{fill:#E73035;fill-opacity:.85;stroke:#0B0E18;stroke-width:.8}
.pin{font-size:9px;fill:#0B0E18}
svg{display:block;min-width:0;width:auto}
</style>
<rect x="0" y="0" width="700" height="400" fill="#F3F0E9"/>
    <text x="250" y="30" text-anchor="middle" class="tm">back (battery side)</text>
    <rect x="30" y="40" width="440" height="120" rx="6" class="wall"/>
