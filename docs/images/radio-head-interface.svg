    <text x="175.88" y="126" class="pin" transform="rotate(50 175.88 126)">VBAT</text>
    <circle cx="199.2" cy="110.16" r="7" fill="#FDA734"/>
    <text x="199.2" y="113.3" text-anchor="middle" class="num" font-size="8.5">4</text>
    <text x="196.2" y="126" class="pin" transform="rotate(50 196.2 126)">3V3</text>
    <circle cx="219.52" cy="110.16" r="7" fill="#00C8E6"/>
    <text x="219.52" y="113.3" text-anchor="middle" class="num" font-size="8.5">5</text>
    <text x="216.52" y="126" class="pin" transform="rotate(50 216.52 126)">SDA</text>
    <circle cx="239.84" cy="110.16" r="7" fill="#00C8E6"/>
    <text x="239.84" y="113.3" text-anchor="middle" class="num" font-size="8.5">6</text>
    <text x="236.84" y="126" class="pin" transform="rotate(50 236.84 126)">SCL</text>
    <circle cx="260.16" cy="110.16" r="7" fill="#9C4AE5"/>
    <text x="260.16" y="113.3" text-anchor="middle" class="numw" font-size="8.5">7</text>
    <text x="257.16" y="126" class="pin" transform="rotate(50 257.16 126)">SCK</text>
    <circle cx="280.48" cy="110.16" r="7" fill="#9C4AE5"/>
    <text x="280.48" y="113.3" text-anchor="middle" class="numw" font-size="8.5">8</text>
    <text x="277.48" y="126" class="pin" transform="rotate(50 277.48 126)">COPI</text>
    <circle cx="300.8" cy="110.16" r="7" fill="#9C4AE5"/>
    <text x="300.8" y="113.3" text-anchor="middle" class="numw" font-size="8.5">9</text>
    <text x="297.8" y="126" class="pin" transform="rotate(50 297.8 126)">CIPO</text>
    <circle cx="321.12" cy="110.16" r="7" fill="#E73035"/>
    <text x="321.12" y="113.3" text-anchor="middle" class="numw" font-size="8.5">10</text>
    <text x="318.12" y="126" class="pin" transform="rotate(50 318.12 126)">CS</text>
    <circle cx="341.44" cy="110.16" r="7" fill="#E73035"/>
    <text x="341.44" y="113.3" text-anchor="middle" class="numw" font-size="8.5">11</text>
    <text x="338.44" y="126" class="pin" transform="rotate(50 338.44 126)">IRQ</text>
    <circle cx="361.76" cy="110.16" r="7" fill="#98A0AC"/>
    <text x="361.76" y="113.3" text-anchor="middle" class="num" font-size="8.5">12</text>
    <text x="358.76" y="126" class="pin" transform="rotate(50 358.76 126)">GND</text>
    <circle cx="138.24" cy="89.84" r="7" fill="#98A0AC"/>
    <text x="138.24" y="92.9" text-anchor="middle" class="num" font-size="8.5">13</text>
    <text x="141.24" y="76" class="pin" transform="rotate(-50 141.24 76)">GND</text>
    <circle cx="158.56" cy="89.84" r="7" fill="#33AA54"/>
    <text x="158.56" y="92.9" text-anchor="middle" class="numw" font-size="8.5">14</text>
    <text x="161.56" y="76" class="pin" transform="rotate(-50 161.56 76)">BUSY</text>
    <circle cx="178.88" cy="89.84" r="7" fill="#E73035"/>
    <text x="178.88" y="92.9" text-anchor="middle" class="numw" font-size="8.5">15</text>
    <text x="181.88" y="76" class="pin" transform="rotate(-50 181.88 76)">RST</text>
    <circle cx="199.2" cy="89.84" r="7" fill="#33AA54"/>
    <text x="199.2" y="92.9" text-anchor="middle" class="numw" font-size="8.5">16</text>
    <text x="202.2" y="76" class="pin" transform="rotate(-50 202.2 76)">TX</text>
    <circle cx="219.52" cy="89.84" r="7" fill="#33AA54"/>
    <text x="219.52" y="92.9" text-anchor="middle" class="numw" font-size="8.5">17</text>
    <text x="222.52" y="76" class="pin" transform="rotate(-50 222.52 76)">RX</text>
    <circle cx="239.84" cy="89.84" r="7" fill="#E73035"/>
    <text x="239.84" y="92.9" text-anchor="middle" class="numw" font-size="8.5">18</text>
    <text x="242.84" y="76" class="pin" transform="rotate(-50 242.84 76)">DET</text>
    <circle cx="260.16" cy="89.84" r="7" class="rsv"/>
    <text x="260.16" y="92.9" text-anchor="middle" class="num" font-size="8.5">19</text>
    <text x="263.16" y="76" class="pin" transform="rotate(-50 263.16 76)">RSV</text>
    <circle cx="280.48" cy="89.84" r="7" class="rsv"/>
    <text x="280.48" y="92.9" text-anchor="middle" class="num" font-size="8.5">20</text>
    <text x="283.48" y="76" class="pin" transform="rotate(-50 283.48 76)">RSV</text>
    <circle cx="300.8" cy="89.84" r="7" class="rsv"/>
    <text x="300.8" y="92.9" text-anchor="middle" class="num" font-size="8.5">21</text>
    <text x="303.8" y="76" class="pin" transform="rotate(-50 303.8 76)">RSV</text>
    <circle cx="321.12" cy="89.84" r="7" class="rsv"/>
    <text x="321.12" y="92.9" text-anchor="middle" class="num" font-size="8.5">22</text>
    <text x="324.12" y="76" class="pin" transform="rotate(-50 324.12 76)">RSV</text>
    <circle cx="341.44" cy="89.84" r="7" fill="#33AA54"/>
    <text x="341.44" y="92.9" text-anchor="middle" class="numw" font-size="8.5">23</text>
    <text x="344.44" y="76" class="pin" transform="rotate(-50 344.44 76)">R_IN</text>
    <circle cx="361.76" cy="89.84" r="7" fill="#98A0AC"/>
    <text x="361.76" y="92.9" text-anchor="middle" class="num" font-size="8.5">24</text>
    <text x="364.76" y="76" class="pin" transform="rotate(-50 364.76 76)">GND</text>
    <text x="250" y="174" text-anchor="middle" class="tm">front (display side)</text>
    <line x1="138.24" y1="186" x2="361.76" y2="186" class="dim"/><line x1="138.24" y1="181" x2="138.24" y2="191" class="dim"/><line x1="361.76" y1="181" x2="361.76" y2="191" class="dim"/>
    <text x="250" y="200" text-anchor="middle" class="dimt">27.94 (11 × 2.54); rows 2.54 apart</text>
    <circle cx="36" cy="222" r="5" fill="#98A0AC"/><text x="45" y="226" class="tm">ground</text>
    <circle cx="100" cy="222" r="5" fill="#FDA734"/><text x="109" y="226" class="tm">power</text>
    <circle cx="158" cy="222" r="5" fill="#00C8E6"/><text x="167" y="226" class="tm">ID I2C</text>
    <circle cx="216" cy="222" r="5" fill="#9C4AE5"/><text x="225" y="226" class="tm">SPI</text>
    <circle cx="262" cy="222" r="5" fill="#E73035"/><text x="271" y="226" class="tm">control</text>
    <circle cx="324" cy="222" r="5" fill="#33AA54"/><text x="333" y="226" class="tm">signal, audio</text>
    <circle cx="410" cy="222" r="5" class="rsv"/><text x="419" y="226" class="tm">reserved</text>
    <text x="486" y="56" class="t">Head shell</text><text x="486" y="69" class="tm">55 × 18 × 15 mm outside, about</text><text x="486" y="82" class="tm">50 × 14 × 12 mm inside</text><text x="486" y="95" class="t">Polarized</text><text x="486" y="108" class="tm">left groove 3.0 mm, right 2.0 mm,</text><text x="486" y="121" class="tm">so it only fits one way up</text><text x="486" y="134" class="t">Contacts</text><text x="486" y="147" class="tm">springs stand 1.0 mm proud, seat at</text><text x="486" y="160" class="tm">0.5 mm; DET (H18) is 0.5 mm shorter;</text><text x="486" y="173" class="tm">head pads are 1.8 × 1.6 mm ovals</text><text x="486" y="186" class="t">Detent</text><text x="486" y="199" class="tm">Ø3 mm ball in the right arm, dimple</text><text x="486" y="212" class="tm">6 mm down the badge side</text><text x="486" y="225" class="t">Antennas</text><text x="486" y="238" class="tm">RP-SMA hole Ø6.5 mm, north face;</text><text x="486" y="251" class="tm">IR windows at both ends</text>
    <rect x="140" y="262" width="80" height="44" class="wall"/><text x="180" y="288" text-anchor="middle" class="tm">badge</text>
    <path d="M166 262 a3 3 0 0 0 6 0" fill="none" stroke="#555D6B" stroke-width="1"/>
    <line x1="140" y1="272" x2="130" y2="272" class="goldl"/>
    <line x1="140" y1="284" x2="133" y2="284" class="goldl"/>
    <line x1="140" y1="296" x2="136" y2="296" class="goldl"/>
    <rect x="55" y="262" width="60" height="44" rx="3" class="headb"/><text x="85" y="288" text-anchor="middle" class="numw">head</text>
    <rect x="115" y="254" width="30" height="7" class="headb"/>
    <circle cx="142" cy="257.5" r="3" class="steel"/>
    <text x="30" y="326" class="t">1 · Arms enter the grooves</text><text x="30" y="340" class="tm">no contact yet</text>
    <rect x="365" y="262" width="80" height="44" class="wall"/><text x="405" y="288" text-anchor="middle" class="tm">badge</text>
    <path d="M391 262 a3 3 0 0 0 6 0" fill="none" stroke="#555D6B" stroke-width="1"/>
    <line x1="365" y1="272" x2="355" y2="272" class="goldl"/>
    <line x1="365" y1="284" x2="358" y2="284" class="goldl"/>
    <line x1="365" y1="296" x2="361" y2="296" class="goldl"/>
    <rect x="295" y="262" width="60" height="44" rx="3" class="headb"/><text x="325" y="288" text-anchor="middle" class="numw">head</text>
    <rect x="355" y="254" width="30" height="7" class="headb"/>
    <circle cx="382" cy="257.5" r="3" class="steel"/>
    <text x="255" y="326" class="t">2 · Long ground springs touch</text><text x="255" y="340" class="tm">power and signals still open</text>
    <rect x="590" y="262" width="80" height="44" class="wall"/><text x="630" y="288" text-anchor="middle" class="tm">badge</text>
    <path d="M616 262 a3 3 0 0 0 6 0" fill="none" stroke="#555D6B" stroke-width="1"/>
    <line x1="590" y1="272" x2="586" y2="272" class="goldl"/>
    <line x1="590" y1="284" x2="586" y2="284" class="goldl"/>
    <line x1="590" y1="296" x2="586" y2="296" class="goldl"/>
    <rect x="526" y="262" width="60" height="44" rx="3" class="headb"/><text x="556" y="288" text-anchor="middle" class="numw">head</text>
    <rect x="586" y="254" width="30" height="7" class="headb"/>
    <circle cx="619" cy="259" r="3" class="steel"/>
    <text x="480" y="326" class="t">3 · Seated, detent clicks</text><text x="480" y="340" class="tm">signals connect, DET last</text>
    <text x="30" y="370" class="tm">Removal reverses it: DET breaks first and the badge cuts the head's power before any signal opens.</text>
    <text x="30" y="384" class="tm">The springs compress along their own axis, so nothing slides across the pads.</text>
  </svg>
