"#00C8E6"/><text x="110" y="64" text-anchor="middle" class="t" font-size="11">magic 'CTRA'</text><rect x="191" y="41" width="38" height="38" rx="4" fill="#98A0AC" fill-opacity=".28" stroke="#98A0AC"/><text x="210" y="64" text-anchor="middle" class="t" font-size="8.5">ver</text><rect x="231" y="41" width="38" height="38" rx="4" fill="#98A0AC" fill-opacity=".28" stroke="#98A0AC"/><text x="250" y="64" text-anchor="middle" class="t" font-size="8.5">hlen</text><rect x="271" y="41" width="78" height="38" rx="4" fill="#98A0AC" fill-opacity=".28" stroke="#98A0AC"/><text x="310" y="64" text-anchor="middle" class="t" font-size="10">TLV length</text><rect x="351" y="41" width="78" height="38" rx="4" fill="#9C4AE5" fill-opacity=".28" stroke="#9C4AE5"/><text x="390" y="64" text-anchor="middle" class="t" font-size="10">vendor ID</text><rect x="431" y="41" width="78" height="38" rx="4" fill="#9C4AE5" fill-opacity=".28" stroke="#9C4AE5"/><text x="470" y="64" text-anchor="middle" class="t" font-size="10">product ID</text><rect x="511" y="41" width="38" height="38" rx="4" fill="#9C4AE5" fill-opacity=".28" stroke="#9C4AE5"/><text x="530" y="64" text-anchor="middle" class="t" font-size="8.5">rev</text><rect x="551" y="41" width="38" height="38" rx="4" fill="#E73035" fill-opacity=".28" stroke="#E73035"/><text x="570" y="64" text-anchor="middle" class="t" font-size="8.5">class</text><rect x="591" y="41" width="38" height="38" rx="4" fill="#E73035" fill-opacity=".28" stroke="#E73035"/><text x="610" y="64" text-anchor="middle" class="t" font-size="8.5">flags</text><rect x="631" y="41" width="38" height="38" rx="4" fill="none" fill-opacity=".28" stroke="#555D6B"/><text x="650" y="64" text-anchor="middle" class="t" font-size="8.5">rsvd</text><rect x="30" y="112" width="40" height="40" class="cell"/><text x="50" y="107" text-anchor="middle" class="bi">16</text><rect x="70" y="112" width="40" height="40" class="cell"/><text x="90" y="107" text-anchor="middle" class="bi">17</text><rect x="110" y="112" width="40" height="40" class="cell"/><text x="130" y="107" text-anchor="middle" class="bi">18</text><rect x="150" y="112" width="40" height="40" class="cell"/><text x="170" y="107" text-anchor="middle" class="bi">19</text><rect x="190" y="112" width="40" height="40" class="cell"/><text x="210" y="107" text-anchor="middle" class="bi">20</text><rect x="230" y="112" width="40" height="40" class="cell"/><text x="250" y="107" text-anchor="middle" class="bi">21</text><rect x="270" y="112" width="40" height="40" class="cell"/><text x="290" y="107" text-anchor="middle" class="bi">22</text><rect x="310" y="112" width="40" height="40" class="cell"/><text x="330" y="107" text-anchor="middle" class="bi">23</text><rect x="350" y="112" width="40" height="40" class="cell"/><text x="370" y="107" text-anchor="middle" class="bi">24</text><rect x="390" y="112" width="40" height="40" class="cell"/><text x="410" y="107" text-anchor="middle" class="bi">25</text><rect x="430" y="112" width="40" height="40" class="cell"/><text x="450" y="107" text-anchor="middle" class="bi">26</text><rect x="470" y="112" width="40" height="40" class="cell"/><text x="490" y="107" text-anchor="middle" class="bi">27</text><rect x="510" y="112" width="40" height="40" class="cell"/><text x="530" y="107" text-anchor="middle" class="bi">28</text><rect x="550" y="112" width="40" height="40" class="cell"/><text x="570" y="107" text-anchor="middle" class="bi">29</text><rect x="590" y="112" width="40" height="40" class="cell"/><text x="610" y="107" text-anchor="middle" class="bi">30</text><rect x="630" y="112" width="40" height="40" class="cell"/><text x="650" y="107" text-anchor="middle" class="bi">31</text><rect x="31" y="113" width="318" height="38" rx="4" fill="#9C4AE5" fill-opacity=".28" stroke="#9C4AE5"/><text x="190" y="136" text-anchor="middle" class="t" font-size="11">serial number</text><rect x="351" y="113" width="78" height="38" rx="4" fill="#FDA734" fill-opacity=".28" stroke="#FDA734"/><text x="390" y="136" text-anchor="middle" class="t" font-size="10">peak mA 3V3</text><rect x="431" y="113" width="78" height="38" rx="4" fill="#FDA734" fill-opacity=".28" stroke="#FDA734"/><text x="470" y="136" text-anchor="middle" class="t" font-size="10">peak mA VBAT</text><rect x="511" y="113" width="158" height="38" rx="4" fill="#33AA54" fill-opacity=".28" stroke="#33AA54"/><text x="590" y="136" text-anchor="middle" class="t" font-size="11">CRC32</text>
  <text x="30" y="182" class="t">class (byte 13)</text><text x="30" y="196" class="tm">1 bay · 2 tool (Bay B) · 3 radio head · 4 pod adapter · 5 power cover</text>
  <text x="30" y="218" class="t">flags (byte 14)</text><text x="30" y="232" class="tm">bit 0 transmits · 1 LAB · 2 smart ID · 3 uses VBAT · 4 hot-swap safe · 5 tool exit</text>
  <text x="30" y="254" class="t">Sizes</text><text x="30" y="268" class="tm">M24C02 (256 B) fits the header plus short records;</text><text x="30" y="281" class="tm">M24C16 (2 KB) fits names and app lists. CRC32 covers all of it.</text>
  <text x="420" y="182" class="t">Records after the header (type, length, value)</text>
  <text x="420" y="198" class="tm">0x01  name</text><text x="420" y="211" class="tm">0x02  driver, e.g. "ctrla,as3935"</text><text x="420" y="224" class="tm">0x03  pin map (what each pad does)</text><text x="420" y="237" class="tm">0x04  FCC ID (transmitters)</text><text x="420" y="250" class="tm">0x05  app IDs it unlocks</text><text x="420" y="263" class="tm">0x06  catalog link for the QR code</text><text x="420" y="276" class="tm">0x07  I2C addresses it uses</text><text x="420" y="289" class="tm">0x08  minimum firmware API</text>
</svg>
