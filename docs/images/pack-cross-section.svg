    <rect x="50.2" y="113.85" width="447.1" height="6.8" class="wall"/>
    <rect x="40" y="113.85" width="10.2" height="58.65" class="wall"/><rect x="497.3" y="113.85" width="10.2" height="58.65" class="wall"/>
    <rect x="268.65" y="120.65" width="10.2" height="45.05" class="wall"/>
    <text x="66" y="154" class="tm" font-size="9" fill="#E6ECF5">Bay A module</text><text x="300" y="155" class="tm" font-size="9" fill="#E6ECF5">Bay B module</text>
    <g class="lead">
      <line x1="510" y1="117.3" x2="560" y2="104"/><line x1="510" y1="121.5" x2="560" y2="120"/><line x1="510" y1="133" x2="560" y2="136"/>
      <line x1="510" y1="150.4" x2="560" y2="152"/><line x1="510" y1="161.5" x2="560" y2="168"/><line x1="510" y1="169.1" x2="560" y2="184"/>
      <line x1="510" y1="236" x2="560" y2="236"/>
    </g>
    <text x="566" y="107" class="t">0.8 lid</text>
    <text x="566" y="123" class="t">0.2 clearance</text>
    <text x="566" y="139" class="t">2.5 parts (estimate)</text>
    <text x="566" y="155" class="t">1.6 module board</text>
    <text x="566" y="171" class="t">1.0 springs, compressed</text>
    <text x="566" y="187" class="t">0.8 carrier board</text>
    <text x="566" y="208" class="h">≈ 6.9 mm pack</text>
    <text x="566" y="239" class="t">15.0 core</text>
    <text x="566" y="256" class="tm">badge ≈ 21.9 mm</text>
    <text x="40" y="320" class="tm">To keep the pack at 6.0 mm, parts drop to about 1.6 mm: the first mechanical decision.</text>
    <text x="40" y="334" class="tm">Dark riser strips at both edges carry the badge's back pads up beside the battery.</text>
  </svg>
