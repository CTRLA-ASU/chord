    <rect x="50.2" y="165.7" width="447.1" height="6.8" class="pcbs"/>
    <line x1="66.35" y1="165.7" x2="66.35" y2="157.2" class="goldl"/><line x1="78.25" y1="165.7" x2="78.25" y2="157.2" class="goldl"/>
    <line x1="469.25" y1="165.7" x2="469.25" y2="157.2" class="goldl"/><line x1="481.15" y1="165.7" x2="481.15" y2="157.2" class="goldl"/>
    <rect x="57" y="143.6" width="204" height="13.6" class="pcbs"/><rect x="286.5" y="143.6" width="204" height="13.6" class="pcbs"/>
