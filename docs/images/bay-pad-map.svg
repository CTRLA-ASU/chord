<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" role="img" aria-label="Twelve-pad bay map with signal names, and a side view of long, normal and short springs showing that ground mates first and the interlock breaks first">
<style>
svg{display:block;width:100%;height:auto;min-width:620px;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-size:11px}
.t{fill:#0B0E18;font-weight:650;font-size:11.5px}
.tm{fill:#555D6B;font-size:10.5px}
.h{fill:#0B0E18;font-weight:700;font-size:12.5px}
.dim{stroke:#555D6B;stroke-width:1;fill:none}
.dimt{fill:#555D6B;font-size:10px;font-weight:600}
.board{fill:#161A22;stroke:#3A4258;stroke-width:1.5}
.padb{fill:none;stroke:#C9A227;stroke-width:1.4;stroke-dasharray:2.2 1.6}
.hole{fill:#F3F0E9;stroke:#C9A227;stroke-width:1.6}
.zone{fill:#FDA734;fill-opacity:.22;stroke:#FDA734;stroke-width:1.2;stroke-dasharray:4 3}
.silk{fill:none;stroke:#E6ECF5;stroke-width:.9;stroke-dasharray:3 2.5;opacity:.8}
.silktext{fill:#E6ECF5;font-size:9.5px;opacity:.9}
.wall{fill:#DDD6C7;stroke:#555D6B;stroke-width:.8}
.shell{fill:#DDD6C7;fill-opacity:.35;stroke:#555D6B;stroke-width:.8}
.pcbs{fill:#161A22;stroke:#3A4258;stroke-width:.8}
.batt{fill:#B8BEC8;fill-opacity:.35;stroke:#8C95A6;stroke-width:.8}
.part{fill:#5A6273;stroke:#8C95A6;stroke-width:.6}
.disp{fill:#0B0E18;stroke:#5A6273;stroke-width:.6}
.gold{fill:#C9A227}
.goldl{stroke:#C9A227;stroke-width:2;stroke-linecap:round}
.guide{stroke:#FDA734;stroke-width:1;stroke-dasharray:4 3}
.lead{stroke:#555D6B;stroke-width:.9;fill:none}
.num{fill:#0B0E18;font-size:10px;font-weight:700}
.numw{fill:#FFFFFF;font-size:10px;font-weight:700}
.springbody{fill:#5A6273;stroke:#8C95A6;stroke-width:.6}
.ghost{fill:none;stroke:#555D6B;stroke-dasharray:4 3}
.arrowl{stroke:#0B0E18;stroke-width:1.3;fill:none}
svg{display:block;min-width:0;width:auto}
</style>
<rect x="0" y="0" width="700" height="330" fill="#F3F0E9"/>
    <g>
      <circle cx="60" cy="40" r="14" fill="#98A0AC"/><text x="60" y="44" text-anchor="middle" class="num">1</text>
      <circle cx="60" cy="80" r="14" fill="#98A0AC"/><text x="60" y="84" text-anchor="middle" class="num">2</text>
      <circle cx="60" cy="120" r="14" fill="#FDA734"/><text x="60" y="124" text-anchor="middle" class="num">3</text>
      <circle cx="60" cy="160" r="14" fill="#FDA734"/><text x="60" y="164" text-anchor="middle" class="num">4</text>
      <circle cx="60" cy="200" r="14" fill="#00C8E6"/><text x="60" y="204" text-anchor="middle" class="num">5</text>
      <circle cx="60" cy="240" r="14" fill="#00C8E6"/><text x="60" y="244" text-anchor="middle" class="num">6</text>
      <circle cx="100" cy="40" r="14" fill="#9C4AE5"/><text x="100" y="44" text-anchor="middle" class="numw">7</text>
      <circle cx="100" cy="80" r="14" fill="#9C4AE5"/><text x="100" y="84" text-anchor="middle" class="numw">8</text>
      <circle cx="100" cy="120" r="14" fill="#9C4AE5"/><text x="100" y="124" text-anchor="middle" class="numw">9</text>
      <circle cx="100" cy="160" r="14" fill="#E73035"/><text x="100" y="164" text-anchor="middle" class="numw">10</text>
      <circle cx="100" cy="200" r="14" fill="#E73035"/><text x="100" y="204" text-anchor="middle" class="numw">11</text>
      <circle cx="100" cy="240" r="14" fill="#33AA54"/><text x="100" y="244" text-anchor="middle" class="numw">12</text>
      <text x="60" y="270" text-anchor="middle" class="tm">outer</text><text x="100" y="270" text-anchor="middle" class="tm">inner</text>
    </g>
    <g>
      <text x="135" y="44" class="t">1 GND</text><text x="190" y="44" class="tm">long spring</text>
      <text x="135" y="84" class="t">2 GND</text><text x="190" y="84" class="tm">long spring</text>
      <text x="135" y="124" class="t">3 3V3_SW</text><text x="200" y="124" class="tm">≤ 100 mA, on while idle</text>
      <text x="135" y="164" class="t">4 VBAT_SW</text><text x="205" y="164" class="tm">≤ 300 mA, off until allowed</text>
      <text x="135" y="204" class="t">5 SDA / 6 SCL</text><text x="225" y="204" class="tm">own mux channel</text>
      <text x="135" y="244" class="t">7 SCK · 8 COPI · 9 CIPO</text><text x="135" y="257" class="tm">shared SPI; CIPO buffered, high-Z until enabled</text>
      <text x="135" y="284" class="t">10 CS · 11 IRQ (or UART/CAN RX)</text>
      <text x="135" y="298" class="t">12 IO (or UART/CAN TX)</text>
      <text x="135" y="312" class="tm">direct S31 pins; IO high-Z until allowed</text>
    </g>
    <g>
      <text x="410" y="30" class="h">Mating order (side view)</text>
      <rect x="410" y="232" width="270" height="12" class="pcbs"/><text x="545" y="258" text-anchor="middle" class="tm">carrier board</text>
      <rect x="455" y="196" width="10" height="36" class="springbody"/><line x1="460" y1="196" x2="460" y2="170" class="goldl"/>
      <rect x="540" y="196" width="10" height="36" class="springbody"/><line x1="545" y1="196" x2="545" y2="178" class="goldl"/>
      <rect x="625" y="196" width="10" height="36" class="springbody"/><line x1="630" y1="196" x2="630" y2="186" class="goldl"/>
      <rect x="420" y="140" width="250" height="10" class="ghost"/><text x="545" y="134" text-anchor="middle" class="tm">module (or lid plate) coming down</text>
      <line x1="690" y1="118" x2="690" y2="150" class="arrowl"/><path d="M686 144 L690 152 L694 144" class="arrowl"/>
      <text x="460" y="278" text-anchor="middle" class="t">Ground</text><text x="460" y="292" text-anchor="middle" class="tm">long · mates first</text>
      <text x="545" y="278" text-anchor="middle" class="t">Power + signals</text><text x="545" y="292" text-anchor="middle" class="tm">standard</text>
      <text x="630" y="278" text-anchor="middle" class="t">Lid interlock</text><text x="630" y="292" text-anchor="middle" class="tm">short · breaks first</text>
      <text x="410" y="318" class="tm">No detect pad: ID chips are polled once a second.</text>
    </g>
  </svg>
