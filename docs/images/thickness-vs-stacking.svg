<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-label="Thickness to scale: phone about 8 mm, badge 15, badge with pack about 21, Flipper Zero about 25, old spec stacks about 25, 33 and 49 mm against a 14 to 18 mm target">
<style>
svg{--c-text:#0B0E18;--c-muted:#555D6B;--c-line:#DDD6C7;--c-card:#FFFFFF;--c-body:#E8E3D8;--c-pack:#FDA734;--c-stack:#E73035;--c-stack-bg:rgba(231,48,53,.12);--c-rail:#E73035;--c-pad:#C9A227;--c-keep:#00C8E6;--c-board:#33AA54;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-size:12.5px}
.bg{fill:#F3F0E9}
.t{fill:var(--c-text);font-weight:600}.tm{fill:var(--c-muted);font-size:11.5px}.tv{fill:var(--c-text);font-weight:700;font-size:12.5px}
.body{fill:var(--c-body);stroke:var(--c-text);stroke-width:1.2}.pack{fill:var(--c-pack);stroke:var(--c-text);stroke-width:1}
.stack{fill:var(--c-stack-bg);stroke:var(--c-stack);stroke-width:1.5}.sep{stroke:var(--c-stack);stroke-width:1.2}
.neutral{fill:var(--c-line);stroke:var(--c-muted);stroke-width:1}.band{fill:var(--c-keep);fill-opacity:.14}
.dash{stroke:var(--c-keep);stroke-width:1;stroke-dasharray:5 4}.base{stroke:var(--c-text);stroke-width:1.2}
.pocket{fill:var(--c-pack);fill-opacity:.2;stroke:var(--c-pack);stroke-width:1.2}.mod{fill:var(--c-board);fill-opacity:.22;stroke:var(--c-board);stroke-width:1.5}
.pad{fill:var(--c-pad);stroke:var(--c-text);stroke-width:.6}.ink{fill:var(--c-text)}.tool{fill:var(--c-card);stroke:var(--c-text);stroke-width:1.2}
.hole{fill:var(--c-card);stroke:var(--c-text);stroke-width:1.2}.batt{fill:none;stroke:var(--c-text);stroke-opacity:.55;stroke-width:1.3;stroke-dasharray:6 4}
.battfill{fill:var(--c-muted);fill-opacity:.22;stroke:var(--c-text);stroke-opacity:.5;stroke-dasharray:5 3}.rail{fill:var(--c-rail);stroke:var(--c-text);stroke-width:1}
.cover{fill:var(--c-muted);fill-opacity:.18;stroke:var(--c-text);stroke-dasharray:5 3}.keep{fill:url(#hatch);stroke:var(--c-keep);stroke-width:1.2}
.hatchline{stroke:var(--c-keep);stroke-width:1.2}.leader{stroke:var(--c-muted);stroke-width:1;fill:none}
.guide{stroke:var(--c-muted);stroke-opacity:.6;stroke-width:1;stroke-dasharray:3 4}.spring{stroke:var(--c-pad);stroke-width:2;stroke-linecap:round}
.boardfill{fill:var(--c-board);fill-opacity:.55;stroke:var(--c-board)}.ghost{fill:none;stroke:var(--c-muted);stroke-dasharray:4 3}
.part{fill:var(--c-muted)}.modlabel{fill:var(--c-text);font-weight:700;font-size:13px}
</style>
<rect class="bg" x="0" y="0" width="700" height="290"/>
    <rect x="20" y="168" width="660" height="16" class="band"/>
    <line x1="20" y1="168" x2="680" y2="168" class="dash"/><line x1="20" y1="184" x2="680" y2="184" class="dash"/>
    <text x="24" y="161" class="tm">Spec target 14–18 mm</text>
    <line x1="20" y1="240" x2="680" y2="240" class="base"/>
    <rect x="40" y="208" width="64" height="32" class="neutral"/>
    <text x="72" y="200" text-anchor="middle" class="tv">≈ 8 mm</text><text x="72" y="258" text-anchor="middle" class="t">Phone</text><text x="72" y="274" text-anchor="middle" class="tm">for scale</text>
    <rect x="132" y="180" width="64" height="60" class="body"/>
    <text x="164" y="172" text-anchor="middle" class="tv">15 mm</text><text x="164" y="258" text-anchor="middle" class="t">Badge + head</text><text x="164" y="274" text-anchor="middle" class="tm">pocket setup</text>
    <rect x="224" y="180" width="64" height="60" class="body"/><rect x="224" y="156" width="64" height="24" class="pack"/>
    <text x="256" y="148" text-anchor="middle" class="tv">≈ 21 mm</text><text x="256" y="258" text-anchor="middle" class="t">+ rear pack</text><text x="256" y="274" text-anchor="middle" class="tm">2 bays</text>
    <rect x="316" y="140" width="64" height="100" class="neutral"/>
    <text x="348" y="132" text-anchor="middle" class="tv">≈ 25 mm</text><text x="348" y="258" text-anchor="middle" class="t">Flipper Zero</text><text x="348" y="274" text-anchor="middle" class="tm">for scale</text>
    <rect x="408" y="180" width="64" height="60" class="body"/><rect x="408" y="140" width="64" height="40" class="stack"/>
    <text x="440" y="132" text-anchor="middle" class="tv">≈ 25 mm</text><text x="440" y="258" text-anchor="middle" class="t">Old spec</text><text x="440" y="274" text-anchor="middle" class="tm">1 board</text>
    <rect x="500" y="180" width="64" height="60" class="body"/><rect x="500" y="108" width="64" height="72" class="stack"/><line x1="500" y1="140" x2="564" y2="140" class="sep"/>
    <text x="532" y="100" text-anchor="middle" class="tv">≈ 33 mm</text><text x="532" y="258" text-anchor="middle" class="t">Old spec</text><text x="532" y="274" text-anchor="middle" class="tm">2 boards</text>
    <rect x="592" y="180" width="64" height="60" class="body"/><rect x="592" y="44" width="64" height="136" class="stack"/><line x1="592" y1="140" x2="656" y2="140" class="sep"/><line x1="592" y1="108" x2="656" y2="108" class="sep"/><line x1="592" y1="76" x2="656" y2="76" class="sep"/>
    <text x="624" y="36" text-anchor="middle" class="tv">≈ 49 mm</text><text x="624" y="258" text-anchor="middle" class="t">Old spec</text><text x="624" y="274" text-anchor="middle" class="tm">4 boards</text>
  </svg>
