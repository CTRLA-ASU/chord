    <circle cx="100" cy="300" r="7" class="mk"/><text x="100" y="303.2" text-anchor="middle" class="mkt">1</text><circle cx="78" cy="236" r="7" class="mk"/><text x="78" y="239.2" text-anchor="middle" class="mkt">2</text><circle cx="104" cy="206" r="7" class="mk"/><text x="104" y="209.2" text-anchor="middle" class="mkt">3</text><circle cx="139" cy="98" r="7" class="mk"/><text x="139" y="101.2" text-anchor="middle" class="mkt">4</text><circle cx="62" cy="56" r="7" class="mk"/><text x="62" y="59.2" text-anchor="middle" class="mkt">5</text><circle cx="90" cy="100" r="7" class="mk"/><text x="90" y="103.2" text-anchor="middle" class="mkt">6</text><circle cx="187" cy="387" r="7" class="mk"/><text x="187" y="390.2" text-anchor="middle" class="mkt">7</text><circle cx="139" cy="46" r="7" class="mk"/><text x="139" y="49.2" text-anchor="middle" class="mkt">8</text><circle cx="58" cy="88" r="7" class="mk"/><text x="58" y="91.2" text-anchor="middle" class="mkt">9</text>
    <text x="270" y="40" class="h">Carrier parts</text>
    <text x="270" y="66" class="t">1  Two pockets, 25.7 × 65.0 mm</text><text x="284" y="79" class="tm">for 24 × 64 mm modules: 0.85 mm side and 0.5 mm end clearance</text><text x="270" y="100" class="t">2  12 springs up per bay, 12 down to the badge</text><text x="284" y="113" class="tm">joined one-to-one through the carrier board</text><text x="270" y="134" class="t">3  Steel dowel pins, Ø1.5 mm</text><text x="284" y="147" class="tm">Bay B is Bay A turned 180° about the centre of the back</text><text x="270" y="168" class="t">4  Lid interlock</text><text x="284" y="181" class="tm">two short springs bridged by a gold plate on the lid</text><text x="270" y="202" class="t">5  4 × M2.5 screws to the badge</text><text x="284" y="215" class="tm">in the corners, outside the battery footprint</text><text x="270" y="236" class="t">6  4 × M2 lid screws</text><text x="284" y="249" class="tm">in the solid end blocks</text><text x="270" y="270" class="t">7  Tool exit slot, 18.0 × 3.2 mm</text><text x="284" y="283" class="tm">in Bay B's bottom wall only</text><text x="270" y="304" class="t">8  Cover pads: VIN_EXT + GND</text><text x="284" y="317" class="tm">passed through so Qi, solar or battery covers still fit</text><text x="270" y="338" class="t">9  North block is plastic only</text><text x="284" y="351" class="tm">it sits over the badge's antenna keep-out (hatched)</text>
  </svg>
