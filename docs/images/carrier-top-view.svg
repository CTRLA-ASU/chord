    <line x1="246" y1="118.2" x2="246" y2="352.2" class="dim"/><line x1="241" y1="118.2" x2="251" y2="118.2" class="dim"/><line x1="241" y1="352.2" x2="251" y2="352.2" class="dim"/><text x="250" y="238" class="dimt">65.0</text>
    <line x1="44.32" y1="128" x2="136.84" y2="128" class="dim" stroke-dasharray="3 2"/><text x="90" y="140" text-anchor="middle" class="dimt" fill="#E6ECF5">25.7</text>
    <rect x="119.2" y="58.8" width="14.4" height="14.4" class="gold"/><rect x="144.4" y="58.8" width="14.4" height="14.4" class="gold"/>
    <text x="126.4" y="84" text-anchor="middle" class="dimt">VIN</text><text x="151.6" y="84" text-anchor="middle" class="dimt">GND</text>
    <circle cx="130" cy="111" r="2.4" class="gold"/><circle cx="148" cy="111" r="2.4" class="gold"/>
    <g class="gold"><circle cx="53.68" cy="212.34" r="1.9"/><circle cx="53.68" cy="221.48" r="1.9"/><circle cx="53.68" cy="230.63" r="1.9"/><circle cx="53.68" cy="239.77" r="1.9"/><circle cx="53.68" cy="248.92" r="1.9"/><circle cx="53.68" cy="258.06" r="1.9"/><circle cx="62.82" cy="212.34" r="1.9"/><circle cx="62.82" cy="221.48" r="1.9"/><circle cx="62.82" cy="230.63" r="1.9"/><circle cx="62.82" cy="239.77" r="1.9"/><circle cx="62.82" cy="248.92" r="1.9"/><circle cx="62.82" cy="258.06" r="1.9"/><circle cx="215.18" cy="212.34" r="1.9"/><circle cx="215.18" cy="221.48" r="1.9"/><circle cx="215.18" cy="230.63" r="1.9"/><circle cx="215.18" cy="239.77" r="1.9"/><circle cx="215.18" cy="248.92" r="1.9"/><circle cx="215.18" cy="258.06" r="1.9"/><circle cx="224.32" cy="212.34" r="1.9"/><circle cx="224.32" cy="221.48" r="1.9"/><circle cx="224.32" cy="230.63" r="1.9"/><circle cx="224.32" cy="239.77" r="1.9"/><circle cx="224.32" cy="248.92" r="1.9"/><circle cx="224.32" cy="258.06" r="1.9"/></g>
