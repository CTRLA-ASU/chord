<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-label="Carrier top view with two pockets, spring rows over the battery side strips, dowel pins, interlock springs, cover pads, screws and the tool exit slot">
<style>
svg{display:block;width:100%;height:auto;min-width:620px;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-size:11px}
.t{fill:#0B0E18;font-weight:650;font-size:11.5px}
