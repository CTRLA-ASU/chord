    <line x1="40" y1="20" x2="238" y2="20" class="dim"/><line x1="40" y1="15" x2="40" y2="25" class="dim"/><line x1="238" y1="15" x2="238" y2="25" class="dim"/><text x="139" y="16" text-anchor="middle" class="dimt">55.0</text>
    <line x1="26" y1="30" x2="26" y2="372" class="dim"/><line x1="21" y1="30" x2="31" y2="30" class="dim"/><line x1="21" y1="372" x2="31" y2="372" class="dim"/><text x="20" y="205" text-anchor="middle" class="dimt" transform="rotate(-90 20 205)">95.0</text>
