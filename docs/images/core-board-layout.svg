      <circle cx="524.6" cy="186.4" r="1.6"/><circle cx="531" cy="186.4" r="1.6"/><circle cx="524.6" cy="193.0" r="1.6"/><circle cx="531" cy="193.0" r="1.6"/><circle cx="524.6" cy="199.6" r="1.6"/><circle cx="531" cy="199.6" r="1.6"/><circle cx="524.6" cy="206.2" r="1.6"/><circle cx="531" cy="206.2" r="1.6"/><circle cx="524.6" cy="212.8" r="1.6"/><circle cx="531" cy="212.8" r="1.6"/><circle cx="524.6" cy="219.4" r="1.6"/><circle cx="531" cy="219.4" r="1.6"/>
