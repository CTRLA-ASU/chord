      <line x1="183" y1="39" x2="238" y2="40"/><line x1="156" y1="70" x2="238" y2="70"/><line x1="216" y1="104" x2="238" y2="100"/>
      <line x1="124" y1="110" x2="238" y2="130"/><line x1="224" y1="160" x2="238" y2="160"/><line x1="48" y1="160" x2="238" y2="190"/>
      <line x1="190" y1="226" x2="238" y2="220"/><line x1="152" y1="264" x2="238" y2="250"/><line x1="156" y1="318" x2="238" y2="310"/>
      <line x1="224" y1="300" x2="238" y2="280"/><line x1="196" y1="362" x2="238" y2="340"/><line x1="140" y1="384" x2="238" y2="370"/>
          </g>
    <text x="244" y="44" class="t">Radio-head contacts</text><text x="244" y="56" class="tm">24 right-angle springs on the top edge</text>
    <text x="244" y="74" class="t">Support chips</text><text x="244" y="86" class="tm">I2C mux, I/O expander, eFuse, ATECC608B, RTC</text>
    <text x="244" y="104" class="t">Speaker amp, speaker pads, RGB LED</text>
    <text x="244" y="134" class="t">ESP32-S31-WROOM-3 module</text><text x="244" y="146" class="tm">certified radio; antenna faces the left edge</text>
    <text x="244" y="164" class="t">Qwiic ports ×2 (side-entry)</text>
    <text x="244" y="194" class="t">Battery connector + MAX17055 fuel gauge</text>
    <text x="244" y="224" class="t">Display footprint</text><text x="244" y="236" class="tm">sits right above the board, so only low parts here</text>
    <text x="244" y="254" class="t">Display flex connector</text>
    <text x="244" y="284" class="t">5-way switch + side buttons</text><text x="244" y="296" class="tm">and through-hole pins to the back riser strips</text>
    <text x="244" y="314" class="t">Power: TPS2121, BQ24074, buck-boost</text>
    <text x="244" y="344" class="t">Audio: ES8388 codec, LDO, TRRS jack</text>
    <text x="244" y="374" class="t">USB-C, microSD, T5838 mic</text>
    <text x="244" y="404" class="t">Antenna keep-out (hatched, top-left)</text><text x="244" y="416" class="tm">no copper on any layer</text>

    <text x="520" y="48" class="h">Bottom side (from the back)</text>
    <rect x="520" y="60" width="132.6" height="236.6" rx="6" class="board"/>
    <rect x="631.8" y="60" width="20.8" height="62.4" class="keep"/>
    <rect x="534.3" y="119.8" width="104" height="169" class="batt"/>
    <text x="586.3" y="208" text-anchor="middle" class="silktext">battery</text><text x="586.3" y="220" text-anchor="middle" class="silktext">604065</text>
    <rect x="638.3" y="179.6" width="13" height="46.8" fill="#2B303C" stroke="#C9A227" stroke-width=".8"/>
    <rect x="521.3" y="179.6" width="13" height="46.8" fill="#2B303C" stroke="#C9A227" stroke-width=".8"/>
