<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" role="img" aria-label="Top-side placement of the Chord core board with labelled parts, and the bottom side seen from the back with the battery area, riser strips and test pads">
<style>
svg{display:block;width:100%;height:auto;min-width:600px;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-size:11.5px}
.t{fill:#0B0E18;font-weight:600;font-size:12px}
.tm{fill:#555D6B;font-size:11px}
.h{fill:#0B0E18;font-weight:700;font-size:12.5px}
.leader{stroke:#555D6B;stroke-width:1;fill:none}
.board{fill:#161A22;stroke:#3A4258;stroke-width:1.5}
.ic{fill:#2B303C;stroke:#5A6273;stroke-width:.8}
.gold{fill:#C9A227}
.goldo{fill:none;stroke:#C9A227;stroke-width:1.2;stroke-dasharray:2 1.5}
.silver{fill:#B9C0CA;stroke:#7D8696;stroke-width:.8}
