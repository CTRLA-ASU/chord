    </g>
    <rect x="520" y="316" width="10" height="10" class="gold"/><text x="536" y="325" class="tm">Test pads for the pogo-pin fixture</text>
    <rect x="520" y="334" width="10" height="10" fill="#2B303C" stroke="#C9A227"/><text x="536" y="343" class="tm">Riser strips (rear-pack pads)</text>
    <rect x="520" y="352" width="10" height="10" class="batt"/><text x="536" y="361" class="tm">Battery on double-sided tape</text>
    <text x="520" y="384" class="tm">No parts on this side: it faces</text><text x="520" y="398" class="tm">the battery and keeps assembly</text><text x="520" y="412" class="tm">single-sided (cheaper).</text>
  </svg>
