.tan{fill:#C8A878;stroke:#8C7A5A;stroke-width:.8}
.silk{fill:none;stroke:#E6ECF5;stroke-width:.9;stroke-dasharray:4 3;opacity:.75}
.silktext{fill:#E6ECF5;font-size:9.5px;opacity:.85}
.chiptext{fill:#0B0E18;font-size:9px;font-weight:700}
.keep{fill:url(#kh);stroke:#00C8E6;stroke-width:1}
.khl{stroke:#00C8E6;stroke-width:1.1}
.hole{fill:#F3F0E9;stroke:#C9A227;stroke-width:2}
.batt{fill:#B8BEC8;fill-opacity:.18;stroke:#B8BEC8;stroke-width:1.2;stroke-dasharray:5 3}
.grid{fill:#C9A227;opacity:.8}
.layer-cu{fill:#C9A227}
.layer-di{fill:#5E6B4E}
.layer-mask{fill:#161A22}
.sw{stroke:#DDD6C7;stroke-width:1}
svg{display:block;min-width:0;width:auto}
</style>
<rect x="0" y="0" width="700" height="430" fill="#F3F0E9"/>
